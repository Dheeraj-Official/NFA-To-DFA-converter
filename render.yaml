# Render.com Deployment Configuration
# This file defines both backend and frontend services

# Backend: FastAPI Web Service
services:
  - type: web
    name: nfa-dfa-api
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    # Environment variables
    envVars:
      - key: PORT
        value: 5000
      - key: ALLOWED_ORIGINS
        # Replace with your actual frontend URL after deployment
        # You can use wildcard (*) for development, but specify exact URL for production
        value: https://nfa-dfa-frontend.onrender.com
    # Health check
    healthCheckPath: /
    # Auto-deploy on push to main branch
    branch: main

# Frontend: Static Site
sites:
  - type: static
    name: nfa-dfa-frontend
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    publishDir: frontend/dist
    # Note: Static sites don't support envVars during build
    # You'll need to hardcode the API URL in production or use a different approach
    # For now, the frontend uses Vite proxy in development and direct API calls in production
    # Auto-deploy on push to main branch
    branch: main
